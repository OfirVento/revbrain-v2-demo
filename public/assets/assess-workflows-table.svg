<svg width="100%" viewBox="0 0 680 1290" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Braen Stone Bid O2C step-level map, manual versus automated</title>
<style>
  .th { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #3D3929; }
  .ts { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #6B6455; }
  .man rect { fill: #FBE3DA; stroke: #D97757; }
  .aut rect { fill: #DCEFEA; stroke: #2C7A6E; }
  .amb rect { fill: #FCEFD6; stroke: #C9962E; }
  .red rect { fill: #F9DCDC; stroke: #C0392B; }
  .pur rect { fill: #E8E3F5; stroke: #6B5CA5; }
  .gry rect { fill: #EEECE7; stroke: #8A8578; }
  .arr { stroke: #8A8578; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8578" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>


<text class="th" x="24" y="64">Opportunity spine</text>
<text class="th" x="356" y="64">Quote sub-process</text>

<g class="man"><rect x="24" y="80" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="100">Rep creates Bid opportunity</text><text class="ts" x="36" y="117">no automation — human entry</text><text class="ts" x="312" y="100" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="24" y="136" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="156">Defaults + tax code set on insert</text><text class="ts" x="36" y="173">Opp Before Save Flow ×2</text><text class="ts" x="312" y="156" text-anchor="end">AUTO</text></g>
<g class="aut"><rect x="24" y="192" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="212">D&amp;B credit check runs</text><text class="ts" x="36" y="229">DNBi_AutoTrigger (managed)</text><text class="ts" x="312" y="212" text-anchor="end">AUTO</text></g>
<g class="aut"><rect x="24" y="248" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="268">Post-save updates + DocuSign</text><text class="ts" x="36" y="285">3 after-save flows</text><text class="ts" x="312" y="268" text-anchor="end">AUTO</text></g>
<g class="man"><rect x="24" y="304" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="324">Set Bid_Opportunity__c checkbox</text><text class="ts" x="36" y="341">627 records conflict with RecordType</text><text class="ts" x="312" y="324" text-anchor="end">MANUAL</text></g>
<g class="man"><rect x="24" y="360" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="380">Pre-Planning → Planning</text><text class="ts" x="36" y="397">no writer found — inferred manual</text><text class="ts" x="312" y="380" text-anchor="end">MANUAL</text></g>
<g class="man"><rect x="24" y="416" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="436">Planning → Out to Bid</text><text class="ts" x="36" y="453">no writer found — inferred manual</text><text class="ts" x="312" y="436" text-anchor="end">MANUAL</text></g>
<g class="pur"><rect x="24" y="472" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="492">Out to Bid → Quoting</text><text class="ts" x="36" y="509">flow can auto-advance · also manual</text><text class="ts" x="312" y="492" text-anchor="end">MIXED</text></g>
<g class="gry"><rect x="24" y="528" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="548">Hand off to quote sub-process</text><text class="ts" x="36" y="565">see right column</text><text class="ts" x="312" y="548" text-anchor="end">→</text></g>
<g class="aut"><rect x="24" y="584" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="604">Quoting → Sent to Customer</text><text class="ts" x="36" y="621">auto on doc generation (Quote_Document flow)</text><text class="ts" x="312" y="604" text-anchor="end">AUTO</text></g>
<g class="man"><rect x="24" y="640" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="660">→ Awaiting Bid Results</text><text class="ts" x="36" y="677">no writer found — inferred manual</text><text class="ts" x="312" y="660" text-anchor="end">MANUAL</text></g>
<g class="man"><rect x="24" y="696" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="716">→ Awaiting Order Results</text><text class="ts" x="36" y="733">80 opps stuck &gt;60d · no SLA exists</text><text class="ts" x="312" y="716" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="24" y="752" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="772">Opportunity auto-closed Won/Lost</text><text class="ts" x="36" y="789">Quote_After_Save_Flow · Close_Oppty</text><text class="ts" x="312" y="772" text-anchor="end">AUTO</text></g>
<g class="red"><rect x="24" y="808" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="828">Close gate — bidder fields only</text><text class="ts" x="36" y="845">9 of 314 closed with no approval</text><text class="ts" x="312" y="828" text-anchor="end">GATE</text></g>
<g class="amb"><rect x="24" y="864" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="36" y="884">Handoff to Vista / Epicor ERP</text><text class="ts" x="36" y="901">Order/Contract/Subscription = 0 records</text><text class="ts" x="312" y="884" text-anchor="end">UNKNOWN</text></g>

