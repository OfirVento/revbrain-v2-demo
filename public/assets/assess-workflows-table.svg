<g class="pur"><rect x="356" y="80" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="100">Create quote</text><text class="ts" x="368" y="117">buttons OR AutoQuoteFlowLauncher</text><text class="ts" x="644" y="100" text-anchor="end">MIXED</text></g>
<g class="man"><rect x="356" y="136" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="156">Add / import quote lines</text><text class="ts" x="368" y="173">Edit Lines · Import Lines (VF)</text><text class="ts" x="644" y="156" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="356" y="192" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="212">Calculate pricing</text><text class="ts" x="368" y="229">CPQ engine · SBQQ_QuoteTrigger</text><text class="ts" x="644" y="212" text-anchor="end">AUTO</text></g>
<g class="amb"><rect x="356" y="248" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="268">QCP custom script runs</text><text class="ts" x="368" y="285">Count MSU JS · slot value unconfirmed</text><text class="ts" x="644" y="268" text-anchor="end">AUTO?</text></g>
<g class="man"><rect x="356" y="304" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="324">Submit for approval</text><text class="ts" x="368" y="341">button click — human initiated</text><text class="ts" x="644" y="324" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="356" y="360" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="380">Route to approvers</text><text class="ts" x="368" y="397">sbaa approval rules + chains</text><text class="ts" x="644" y="380" text-anchor="end">AUTO</text></g>
<g class="man"><rect x="356" y="416" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="436">Approvers decide (Alex + Lou)</text><text class="ts" x="368" y="453">11,401 Bid actions · 18 rejected (0.16%)</text><text class="ts" x="644" y="436" text-anchor="end">MANUAL</text></g>
<g class="man"><rect x="356" y="472" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="492">If rejected → rework lines</text><text class="ts" x="368" y="509">no rejection counter exists</text><text class="ts" x="644" y="492" text-anchor="end">MANUAL</text></g>
<g class="man"><rect x="356" y="528" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="548">Recall / revoke approval</text><text class="ts" x="368" y="565">98 recalled · 47 revoked (Bid-scoped)</text><text class="ts" x="644" y="548" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="356" y="584" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="604">Lock quote-line pricing on approval</text><text class="ts" x="368" y="621">Quote_After_Save_Flow</text><text class="ts" x="644" y="604" text-anchor="end">AUTO</text></g>
<g class="man"><rect x="356" y="640" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="660">Mark as primary quote</text><text class="ts" x="368" y="677">no automation found</text><text class="ts" x="644" y="660" text-anchor="end">MANUAL</text></g>
<g class="aut"><rect x="356" y="696" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="716">Roll quote amount to Opportunity</text><text class="ts" x="368" y="733">Quote_After_Save_Flow + Updates_V2_1</text><text class="ts" x="644" y="716" text-anchor="end">AUTO</text></g>
<g class="aut"><rect x="356" y="752" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="772">Sync approved-primary flag</text><text class="ts" x="368" y="789">admin-settable · 36 records drift</text><text class="ts" x="644" y="772" text-anchor="end">AUTO</text></g>
<g class="man"><rect x="356" y="808" width="300" height="46" rx="8" stroke-width="1"/><text class="th" x="368" y="828">Pick close stage on the quote</text><text class="ts" x="368" y="845">Opportunity_Stage_User_Selected__c</text><text class="ts" x="644" y="828" text-anchor="end">MANUAL</text></g>

